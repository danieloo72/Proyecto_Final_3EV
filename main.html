<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Estadísticas F1 - Mi galería</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles/style_main.css">
</head>
<body class="modo-claro">
    <!-- Contenedor con grid -->
    <div class="grid-layout">
        <header class="header">
            <h1>Galería de Escuderías F1</h1>
            
            <!-- Busqueda y filtros -->
            <div class="controles">
                 <nav class="navbar bg-body-tertiary">
                    <div class="container-fluid justify-content-center">
                        <form class="d-flex" role="search">
                            <input id="buscarEscuderia" class="form-control me-2" type="search" placeholder="Nombre de la escudería" aria-label="Search"/>
                            <button id="btnBuscar" type="button" class="btn btn-outline-danger">Buscar</button>
                            <button id="borrarBusqueda" type="button" class="btn btn-outline-danger">Borrar</button>
                        </form>
                    </div>
                </nav>
            </div>

            

            <!-- Seleccion de fondo y para añadir una nueva tarjeta -->
            <div class="opciones d-flex align-items-center gap-2">
                <div class="dropdown">
                    <button class="btn dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" id="btnDropdownTema">Seleccionar Tema</button>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item tema-option" href="#" data-value="claro">Modo Claro</a></li>
                        <li><a class="dropdown-item tema-option" href="#" data-value="oscuro">Modo Oscuro</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item tema-option" href="#" data-value="personalizado">Personalizado</a></li>
                    </ul>
                </div>

                <button id="btnAbrirAdd" type="button" class="btn btn-outline-warning">Añadir Nueva</button>
            </div>
        </header>

        <!-- Contenedor donde aparecen las tarjetas nuevas -->
        <main id="resultado" class="main-content"></main>
    </div>

    <!-- Modal de personalizacion del fondo -->
    <div id="modalPersonalizado" class="modal-personalizado">
        <div class="modal-box">
            <h3>Elegir Colores</h3>
            <label>Color Header: <input type="color" id="colorHeader" value="#e10600"></label>
            <label>Color Main: <input type="color" id="colorMain" value="#ffffff"></label>
            <label>Color Footer: <input type="color" id="colorFooter" value="#f8f8f8"></label>
            <button id="btnAplicarColores">Aplicar</button>
            <button onclick="document.getElementById('modalPersonalizado').style.display='none'">Cancelar</button>
        </div>
    </div>

    <!-- Modal de añadir nuevas tarjetas -->
    <div id="modalAdd" class="modal-personalizado">
        <div class="modal-box">
            <h3>Nueva Escudería</h3>
            <input type="text" id="nuevoNombre" placeholder="Nombre">
            <textarea id="nuevaDesc" placeholder="Descripción"></textarea>
            <input type="file" id="nuevaImg" accept="image/*">
            <button id="btnGuardar">Guardar Escudería</button>
            <button id="btnCancelarAdd">Cancelar</button>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>Proyecto Final 3EV - Lenguaje de Marcas - Daniel</p>
    </footer>
    <script src="Scripts/scripts.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
